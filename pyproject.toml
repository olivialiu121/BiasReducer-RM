[project]
name = "biasreducer"
version = "0.1.0"
description = "BiasReducer: dataset-adaptive editing of reward-model heads for bias mitigation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "numpy",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["biasreducer*"]
